services:
  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      PROCESSOR_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - whisper_cache:/root/.cache/huggingface
      - processor_data:/app/tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  whisper_cache:
  processor_data:
